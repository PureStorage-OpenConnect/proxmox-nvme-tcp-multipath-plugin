# NVMe-TCP Connection Configuration
# Copy this file to /etc/nvme-tcp/<storage-name>.conf
# Then enable the service: systemctl enable --now nvme-tcp-connect@<storage-name>

# Target subsystem NQN (required)
SUBNQN="nqn.2024-01.com.example:storage"

# Target portal addresses, comma-separated for multipath (required)
PORTALS="192.168.1.100,192.168.1.101"

# Target port (default: 8009)
PORT=8009

# Host network interfaces, comma-separated (optional)
# Use this to bind connections to specific network interfaces
# Example: "eth0,eth1" for multipath over two interfaces
HOST_IFACE=""

# Host transport addresses/IPs, comma-separated (optional)
# Use this to specify source IP addresses for connections
# Example: "192.168.1.10,192.168.2.10" for multipath with specific source IPs
HOST_TRADDR=""

# Controller loss timeout in seconds (default: 1800)
# How long to wait before giving up on a lost controller
CTRL_LOSS_TMO=1800

# Reconnect delay in seconds (default: 10)
# How long to wait between reconnection attempts
RECONNECT_DELAY=10

# IO Policy for multipath (default: queue-depth)
# Options: round-robin, numa, queue-depth
IOPOLICY="queue-depth"

